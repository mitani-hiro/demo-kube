apiVersion: v1
kind: Pod
metadata:
  name: kafka-producer
  namespace: demo
  labels:
    app: kafka
    component: producer
spec:
  containers:
    - name: producer
      image: public.ecr.aws/h7f0r1p2/demo-kube:producer
      imagePullPolicy: Always
      ports:
        - containerPort: 50051
      env:
        - name: KAFKA_BROKER
          value: "kafka-service.demo.svc.cluster.local:9092"
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 10
        periodSeconds: 15
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: producer-service
  namespace: demo
spec:
  selector:
    app: kafka
    component: producer
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051

apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: demo
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: demo
spec:
  serviceName: "kafka-service"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          command:
            - sh
            - -c
            - |
              # KRaftモードでの起動準備
              export KAFKA_CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
              /opt/kafka/bin/kafka-storage.sh format -t $KAFKA_CLUSTER_ID -c /opt/kafka/config/kraft/server.properties

              # Kafka起動
              /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties \
                --override node.id=1 \
                --override process.roles=broker,controller \
                --override controller.quorum.voters=1@localhost:9093 \
                --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093 \
                --override advertised.listeners=PLAINTEXT://kafka-service.demo.svc.cluster.local:9092 \
                --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
                --override controller.listener.names=CONTROLLER \
                --override inter.broker.listener.name=PLAINTEXT \
                --override log.dirs=/tmp/kraft-combined-logs
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
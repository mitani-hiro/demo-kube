apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    access-control.config-files=/etc/trino/access-control/access-control.properties
  node.properties: |
    node.environment=demo
    node.id=trino-demo
    node.data-dir=/data/trino
  log.properties: |
    io.trino=INFO
  jvm.config: |
    -server
    -Xmx512m
    -XX:+UseG1GC
    -XX:+ExplicitGCInvokesConcurrent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
data:
  tpch.properties: |
    connector.name=tpch
  memory.properties: |
    connector.name=memory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-access-control
data:
  # OPA は同一 namespace のためサービス短縮名で解決する（overlay 間で patch 不要）
  access-control.properties: |
    access-control.name=opa
    opa.policy.uri=http://opa:8181/v1/data/trino/access_control/allow
    opa.log-requests=true
    opa.log-responses=true
---
apiVersion: v1
kind: Service
metadata:
  name: trino
spec:
  selector:
    app: trino
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
        - name: trino
          image: trinodb/trino:475
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/trino
            - name: catalog
              mountPath: /etc/trino/catalog
            - name: access-control
              mountPath: /etc/trino/access-control
      volumes:
        - name: config
          configMap:
            name: trino-config
        - name: catalog
          configMap:
            name: trino-catalog
        - name: access-control
          configMap:
            name: trino-access-control

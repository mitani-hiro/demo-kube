apiVersion: v1
kind: Pod
metadata:
  name: kafka-producer
  labels:
    app: kafka
spec:
  containers:
    - name: producer
      image: producer:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 50051
      env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 10
        periodSeconds: 15
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: producer-service
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy
  labels:
    app: policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy
  template:
    metadata:
      labels:
        app: policy
    spec:
      containers:
      - name: policy
        image: policy:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50052
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "password"
        - name: DB_NAME
          value: "policydb"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: policy
spec:
  selector:
    app: policy
  ports:
    - protocol: TCP
      port: 50052
      targetPort: 50052
  type: ClusterIP
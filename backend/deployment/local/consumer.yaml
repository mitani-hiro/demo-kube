apiVersion: v1
kind: Pod
metadata:
  name: kafka-consumer
spec:
  containers:
    - name: consumer
      image: consumer:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace 自体は Terraform 管理（GHA ロールの権限を namespace スコープに限定するため）
namespace: demo

resources:
  - ../../base
  - ingress.yaml

images:
  - name: api
    newName: public.ecr.aws/h7f0r1p2/demo-kube
    newTag: api
  - name: producer
    newName: public.ecr.aws/h7f0r1p2/demo-kube
    newTag: producer
  - name: consumer
    newName: public.ecr.aws/h7f0r1p2/demo-kube
    newTag: consumer

patches:
  # タグ（api/producer/consumer）は上書き運用のため常に pull する
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: producer
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: consumer
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

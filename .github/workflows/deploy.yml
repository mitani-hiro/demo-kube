name: Build and Deploy to EKS

on:
  push:
    branches: ["develop"]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push to ECR Public and Deploy to EKS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      CLUSTER_NAME: eks-cluster-demo
      NAMESPACE: demo
      ECR_REPOSITORY: public.ecr.aws/h7f0r1p2/demo-kube

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::421156463971:role/eks-oidc-deloy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build producer Docker image
        run: |
          docker build -t $ECR_REPOSITORY:producer -f backend/kafka/producer/Dockerfile .

      - name: Build consumer Docker image
        run: |
          docker build -t $ECR_REPOSITORY:consumer -f backend/kafka/consumer/Dockerfile .

      - name: Push producer image to ECR Public
        run: |
          docker push $ECR_REPOSITORY:producer

      - name: Push consumer image to ECR Public
        run: |
          docker push $ECR_REPOSITORY:consumer

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME \
            --kubeconfig ~/.kube/config

      - name: Verify access to EKS
        run: |
          kubectl get nodes

      - name: Deploy Kafka and Apps to EKS
        run: |
          kubectl apply -n $NAMESPACE -f backend/deployment/kafka-deployment_dev.yaml
          kubectl apply -n $NAMESPACE -f backend/deployment/producer_dev.yaml
          kubectl apply -n $NAMESPACE -f backend/deployment/consumer_dev.yaml

name: Build and Deploy to EKS

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: public.ecr.aws/h7f0r1p2/demo-kube

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'backend/common/**'
              - 'backend/proto/**'
            api:
              - 'backend/api/**'
            producer:
              - 'backend/kafka/producer/**'
            consumer:
              - 'backend/kafka/consumer/**'

      - name: Build service matrix
        id: matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          API: ${{ steps.filter.outputs.api }}
          PRODUCER: ${{ steps.filter.outputs.producer }}
          CONSUMER: ${{ steps.filter.outputs.consumer }}
        run: |
          services=()
          # common/proto の変更は全サービスに影響するため全ビルド
          if [ "$SHARED" = "true" ]; then
            services=(api producer consumer)
          else
            [ "$API" = "true" ] && services+=(api)
            [ "$PRODUCER" = "true" ] && services+=(producer)
            [ "$CONSUMER" = "true" ] && services+=(consumer)
          fi
          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -cs 'map(select(length > 0))')
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "build targets: $json"

  preflight:
    name: Check EKS cluster exists
    runs-on: ubuntu-latest
    outputs:
      cluster_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check cluster
        id: check
        run: |
          # 検証時のみ apply するコスト運用のため、destroy 中でも push が失敗しないようにする
          if aws eks describe-cluster --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EKS cluster '${{ vars.EKS_CLUSTER_NAME }}' not found (destroyed?). Deploy will be skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        include:
          - service: api
            dockerfile: backend/api/Dockerfile
          - service: producer
            dockerfile: backend/kafka/producer/Dockerfile
          - service: consumer
            dockerfile: backend/kafka/consumer/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EKS and verify
    needs: [changes, build, preflight]
    # ビルド対象がない場合（マニフェストのみの変更）でもデプロイは実行する。
    # クラスタ不在時（terraform destroy 後）は正常スキップ
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.preflight.outputs.cluster_exists == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Deploy manifests (kustomize)
        env:
          WAF_ACL_ARN: ${{ vars.WAF_ACL_ARN }}
        run: |
          # WAF ARN 未設定のまま ALB が WAF なしで公開される fail-open を防ぐ
          if [ -z "$WAF_ACL_ARN" ]; then
            echo "::error::WAF_ACL_ARN variable is not set; refusing to deploy without WAF"
            exit 1
          fi
          kubectl kustomize backend/deployment/overlays/develop \
            | envsubst '$WAF_ACL_ARN' \
            | kubectl apply -f -

      - name: Restart deployments to pick up new images
        if: needs.build.result == 'success'
        run: kubectl rollout restart deployment api producer consumer -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status statefulset/kafka -n "$NAMESPACE" --timeout=300s
          for d in api producer consumer opa trino; do
            kubectl rollout status deployment/"$d" -n "$NAMESPACE" --timeout=300s
          done

      - name: Smoke test (in-cluster)
        run: |
          kubectl run smoke-test --rm -i --restart=Never -n "$NAMESPACE" \
            --image=curlimages/curl:8.13.0 -- \
            -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -X POST http://api-service:8080/api/hoge
          echo ""
          echo "in-cluster API call: OK"

      - name: Verify consumer received message
        run: |
          # consumer の消費まで数十秒かかることがあるためリトライする
          for i in $(seq 1 12); do
            if kubectl logs deployment/consumer -n "$NAMESPACE" --tail=20 | grep "received message"; then
              echo "consumer consumption: OK"
              exit 0
            fi
            echo "waiting for consumer... ($i/12)"
            sleep 5
          done
          echo "consumer did not receive any message"
          exit 1

      - name: Verify WAF geo restriction (expect 403 from US runner)
        id: waf
        run: |
          ALB_DNS=""
          for i in $(seq 1 30); do
            ALB_DNS=$(kubectl get ingress api -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$ALB_DNS" ] && break
            echo "waiting for ALB provisioning... ($i/30)"
            sleep 10
          done
          if [ -z "$ALB_DNS" ]; then
            echo "ALB DNS not assigned"; exit 1
          fi
          echo "ALB: $ALB_DNS"
          echo "alb_url=http://$ALB_DNS" >> "$GITHUB_OUTPUT"
          # GitHub ランナーは US リージョンのため、Geo 制限 (JP のみ許可) が効いていれば 403 になる
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "http://$ALB_DNS/api/hoge" || true)
            echo "attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "403" ]; then
              echo "WAF geo restriction: OK (blocked from US)"
              exit 0
            fi
            sleep 10
          done
          echo "WAF did not return 403 from US runner"
          exit 1
    outputs:
      alb_url: ${{ steps.waf.outputs.alb_url }}

  e2e:
    name: E2E via CodeBuild (Tokyo, passes WAF)
    needs: [changes, deploy]
    # GHA ランナー(US)は WAF の Geo 制限で弾かれるため、東京リージョンの CodeBuild から実行する。
    # api のコード変更時（または手動実行時）のみ走らせる
    if: >-
      always() && needs.deploy.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.services), 'api'))
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Playwright API E2E on CodeBuild
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: ${{ vars.E2E_CODEBUILD_PROJECT }}
          source-version-override: ${{ github.sha }}
          env-vars-for-codebuild: API_BASE_URL
        env:
          API_BASE_URL: ${{ needs.deploy.outputs.alb_url }}
